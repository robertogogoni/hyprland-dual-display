# Pin Intel GPU minimum frequency to 600 MHz for dual-display stability.
# NOTE: card1 is the Intel GPU on this system (card0 is the blacklisted NVIDIA).
# On most Intel-only systems, change card1 to card0.
# Check yours with: ls /sys/class/drm/card*/gt_min_freq_mhz
w /sys/class/drm/card1/gt_min_freq_mhz - - - - 600
