# Optimized VM tuning for zram-only swap on 8GB RAM system
# zram compresses pages in-RAM at near-CPU speed, so higher swappiness is beneficial
# as it tells the kernel to prefer compressing inactive pages over dropping file caches

# Higher swappiness for zram (default: 60, recommended for zram: 150-180)
vm.swappiness = 150

# More aggressive inode/dentry cache reclaim to free memory faster
vm.vfs_cache_pressure = 150

# Reduce watermark boost factor to avoid unnecessary memory reclaim bursts
vm.watermark_boost_factor = 0

# Lower watermark scale to trigger kswapd earlier, preventing sudden stalls
vm.watermark_scale_factor = 125

# Reduce page-cluster for zram (sequential readahead is useless for compressed swap)
vm.page-cluster = 0
