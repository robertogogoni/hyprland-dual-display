# GF117M (GeForce 710M, PCI 10de:1140) is Fermi-era and NOT supported by
# nvidia-open-dkms (requires Turing+ with GSP). Blacklist to stop probe errors.
# The system runs on Intel HD 4400 integrated graphics.
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset
blacklist nvidia_uvm

# Keep nouveau blacklisted too (no benefit on this GPU with Hyprland/Intel primary)
blacklist nouveau
