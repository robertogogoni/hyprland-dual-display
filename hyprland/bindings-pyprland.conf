# Pyprland keybindings
# Scratchpads — floating overlay windows toggled with hotkeys

# Dropdown terminal (Quake-style from top)
bindd = SUPER, A, Dropdown terminal, exec, pypr toggle term

# System monitor
bindd = SUPER CTRL, B, System monitor, exec, pypr toggle btop

# File manager (floating overlay)
bindd = SUPER CTRL, E, File explorer, exec, pypr toggle files

# Spotify (floating overlay)
bindd = SUPER CTRL, M, Music player, exec, pypr toggle spotify

# Obsidian quick notes
bindd = SUPER CTRL, N, Quick notes, exec, pypr toggle notes

# Magnify — essential on 768p displays
bindd = SUPER, Z, Toggle zoom, exec, pypr zoom
bindd = SUPER SHIFT, Z, Zoom in more, exec, pypr zoom ++0.5

# Screenshot with annotation (Shift+Print)
bindd = SHIFT, PRINT, Screenshot + annotate, exec, grim -g "$(slurp)" - | swappy -f -

# Clipboard history — searchable paste from history
bindd = SUPER, V, Clipboard history, exec, cliphist list | rofi -dmenu -p "📋 Paste" -theme-str 'window { width: 40%; }' -theme-str 'listview { lines: 15; }' | cliphist decode | wl-copy

# Focus mode — fullscreen + disable other monitor
bindd = SUPER, F2, Focus mode, exec, hypr-focus-mode

# Zen mode — zero-chrome fullscreen + blank other monitor
bindd = SUPER, F3, Zen mode, exec, hypr-zen-mode

# Swap workspaces between monitors
bindd = SUPER CTRL, S, Swap monitors, exec, pypr shift_monitors +1

# Keybinding cheat sheet (floating terminal popup)
bindd = SUPER, F1, Keybinding cheat sheet, exec, ghostty --class=hypr-cheatsheet -e hypr-cheatsheet

# Reorganize all windows to correct workspaces
bindd = SUPER SHIFT, F1, Reorganize windows, exec, hypr-reorganize
