# Workspace layout — managed by split-monitor-workspaces plugin
# Each monitor gets 5 independent workspaces (press SUPER+1-5 on either monitor)
#
# ── Laptop (eDP-1): internal IDs 1-5 ───────────
#   1 = Dev       (terminals, editors, Beeper)
#   2 = Chat      (Signal, Discord, Slack, WhatsApp)
#   3 = Work      (Obsidian, email)
#   4 = Games     (Steam, Lutris)
#   5 = System    (btop, htop)
#
# ── TV (HDMI-A-1): internal IDs 6-10 ───────────
#   1 = Web       (browsers)
#   2 = Media     (Spotify, VLC, mpv)
#   3 = Reference (PDF readers, docs)
#   4 = Files     (Nautilus, file managers)
#   5 = Extra
#
# When TV is disconnected, workspaces 6-10 migrate to the laptop automatically.
