# Extra autostart processes
# exec-once = uwsm-app -- my-service

# Unlock gnome-keyring with empty password for auto-login credential persistence.
# WARNING: An empty-password keyring means any process on this system can read
# stored credentials without authentication. This is a convenience tradeoff for
# auto-login setups (SDDM autologin, no lock screen). If you use a login password
# or lock your session, you should remove this line and let the keyring prompt.
exec-once = echo -n "" | gnome-keyring-daemon --replace --unlock --components=pkcs11,secrets

# Pyprland — IPC-based scratchpads, magnify, shift monitors
exec-once = ~/.local/bin/pypr

# Smart workspace — auto-categorizes windows to the right workspace
exec-once = ~/.local/bin/hypr-smart-workspace

# Monitor handler — migrates windows when TV connects/disconnects
exec-once = ~/.local/bin/hypr-monitor-handler

# Clipboard history — stores copy events for SUPER+V recall
exec-once = wl-paste --watch cliphist store

# Activity pulse — flashes workspace buttons on background updates
exec-once = ~/.local/bin/hypr-activity-pulse

# Auto-hide dock — hover bottom edge of laptop screen to reveal
exec-once = nwg-dock-hyprland -d -i 36 -o eDP-1 -mb 4 -hd 50 -nolauncher -g "ghostty-dropterm,ghostty-btop,hypr-cheatsheet"

# Launch terminal on boot
exec-once = ghostty
